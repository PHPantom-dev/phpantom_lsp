name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      benchmark-shards:
        description: Benchmark workers for a controlled timing run
        type: choice
        options: ["8", "12", "16"]
        default: "12"

# A newer revision makes the previous PR measurements obsolete. Main pushes
# keep separate groups so publishing benchmark history is never interrupted.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  # Coverage uses instrumentation rather than debuginfo. Smaller test
  # binaries avoid slow links and the need to delete runner software.
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    env:
      CARGO_BUILD_TARGET: x86_64-unknown-linux-musl
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_RUSTFLAGS: -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@v4
      - name: Test benchmark helpers
        run: python3 -m unittest discover -s benches -p 'test_*.py'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy
          targets: ${{ env.CARGO_BUILD_TARGET }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
      - name: Set up musl build
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools mold
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      # `semantic-export` is off by default, so nothing above compiles it.
      # Without these steps a refactor of an internal API breaks the module
      # and no job notices until someone builds with the feature on. They
      # run here rather than in the test job so that job keeps measuring
      # exactly the feature set the released binary is built with.
      - run: cargo clippy --locked --all-targets --features semantic-export -- -D warnings
      - run: cargo test --locked --features semantic-export --lib --test semantic_export semantic_export

  test-windows-build:
    name: Test (Windows build)
    runs-on: windows-2025
    continue-on-error: true
    env:
      CARGO_BUILD_TARGET: x86_64-pc-windows-msvc
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
      - name: Identify Windows test archive
        id: identity
        shell: pwsh
        run: |
          $inputs = (rustc -vV | Out-String) + $env:ImageVersion + $env:CARGO_BUILD_TARGET + $env:CARGO_PROFILE_DEV_DEBUG + $env:CARGO_PROFILE_TEST_DEBUG + $env:CARGO_INCREMENTAL
          $bytes = [System.Text.Encoding]::UTF8.GetBytes($inputs)
          $digest = [Convert]::ToHexString([System.Security.Cryptography.SHA256]::HashData($bytes)).ToLowerInvariant()
          "key=windows-test-archive-v1-$env:GITHUB_SHA-$digest" >> $env:GITHUB_OUTPUT
      - name: Restore exact Windows test archive
        id: archive
        uses: actions/cache/restore@v4
        with:
          path: |
            windows-tests.tar.zst
            target/cargo-timings
          key: ${{ steps.identity.outputs.key }}
      - uses: Swatinem/rust-cache@v2
        if: steps.archive.outputs.cache-hit != 'true'
        with:
          shared-key: windows-2025
      - uses: taiki-e/install-action@v2
        if: steps.archive.outputs.cache-hit != 'true'
        with:
          tool: cargo-nextest@0.9.151
      - name: Build Windows tests once
        if: steps.archive.outputs.cache-hit != 'true'
        run: cargo nextest archive --locked --archive-file windows-tests.tar.zst --timings
      - uses: actions/cache/save@v4
        if: steps.archive.outputs.cache-hit != 'true'
        with:
          path: |
            windows-tests.tar.zst
            target/cargo-timings
          key: ${{ steps.identity.outputs.key }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows-tests
          path: windows-tests.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build-timings
          path: target/cargo-timings/
          if-no-files-found: error
          retention-days: 1

  test-windows-shard:
    name: Test (Windows shard ${{ matrix.shard }}/4)
    runs-on: windows-2025
    needs: test-windows-build
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.151
      - uses: actions/download-artifact@v4
        with:
          name: windows-tests
      - name: Run compiled Windows tests
        run: >-
          cargo nextest run --archive-file windows-tests.tar.zst
          --partition hash:${{ matrix.shard }}/4 --no-fail-fast
      - name: Record successful partition
        shell: pwsh
        run: Set-Content -Path "windows-shard-${{ matrix.shard }}.passed" -Value "$env:GITHUB_SHA" -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: windows-result-${{ matrix.shard }}
          path: windows-shard-${{ matrix.shard }}.passed
          if-no-files-found: error
          retention-days: 1

  # Preserve the existing non-blocking Windows check while accounting for
  # the build and every partition of the full suite.
  test-windows:
    name: Test (Windows)
    runs-on: ubuntu-24.04
    needs: [test-windows-build, test-windows-shard]
    if: ${{ !cancelled() }}
    continue-on-error: true
    steps:
      - name: Check every Windows shard passed
        env:
          BUILD_RESULT: ${{ needs.test-windows-build.result }}
          SHARD_RESULT: ${{ needs.test-windows-shard.result }}
        run: |
          test "$BUILD_RESULT" = success
          test "$SHARD_RESULT" = success
      - uses: actions/download-artifact@v4
        with:
          pattern: windows-result-*
          path: windows-results
          merge-multiple: true
      - name: Verify all four partitions completed this revision
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          for shard in range(1, 5):
              path = Path(f"windows-results/windows-shard-{shard}.passed")
              if not path.is_file() or path.read_text(encoding="utf-8-sig").strip() != os.environ["GITHUB_SHA"]:
                  raise SystemExit(f"Windows shard {shard} has no successful result for this revision")
          PY

  test-build:
    name: Test (build coverage)
    runs-on: ubuntu-24.04
    env:
      CARGO_BUILD_TARGET: x86_64-unknown-linux-musl
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_RUSTFLAGS: -C link-arg=-fuse-ld=mold
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
          components: llvm-tools-preview
          targets: ${{ env.CARGO_BUILD_TARGET }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: coverage
          workspaces: . -> target/llvm-cov-target
      - name: Set up musl build
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools mold
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1,cargo-nextest@0.9.151
      - name: Build instrumented tests once
        run: cargo llvm-cov nextest-archive --locked --archive-file coverage-tests.tar.zst --timings
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-tests
          path: coverage-tests.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-build-timings
          path: target/llvm-cov-target/cargo-timings/
          if-no-files-found: error
          retention-days: 1

  test-shard:
    name: Test (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-24.04
    needs: test-build
    env:
      CARGO_BUILD_TARGET: x86_64-unknown-linux-musl
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1,cargo-nextest@0.9.151
      - uses: actions/download-artifact@v4
        with:
          name: coverage-tests
      - name: Run compiled tests with coverage
        env:
          LLVM_PROFILE_FILE_NAME: phpantom-%8m.profraw
        run: >-
          cargo llvm-cov nextest --archive-file coverage-tests.tar.zst
          --partition hash:${{ matrix.shard }}/${{ strategy.job-total }}
          --lcov --output-path lcov-${{ matrix.shard }}.info
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.shard }}
          path: lcov-${{ matrix.shard }}.info
          if-no-files-found: error
          retention-days: 1

  # Preserve the required "Test" check and upload only complete coverage.
  test:
    name: Test
    runs-on: ubuntu-24.04
    needs: [test-build, test-shard]
    if: always()
    env:
      CODECOV_AVAILABLE: ${{ secrets.CODECOV_TOKEN != '' }}
    steps:
      - name: Check all test shards passed
        env:
          BUILD_RESULT: ${{ needs.test-build.result }}
          SHARD_RESULT: ${{ needs.test-shard.result }}
        run: |
          test "$BUILD_RESULT" = success
          test "$SHARD_RESULT" = success
      - uses: actions/checkout@v4
      - name: Download coverage reports
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-[1-6]
          path: coverage
          merge-multiple: true
      - name: List coverage reports
        id: reports
        run: |
          reports=(coverage/lcov-*.info)
          (IFS=,; echo "files=${reports[*]}") >> "$GITHUB_OUTPUT"
      - name: Upload to Codecov
        if: github.event_name != 'workflow_dispatch' || env.CODECOV_AVAILABLE == 'true'
        uses: codecov/codecov-action@v5
        with:
          files: ${{ steps.reports.outputs.files }}
          disable_search: true
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  wasm:
    name: WebAssembly
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
          components: clippy
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm
      - run: cargo clippy --locked --lib --target wasm32-wasip1 -- -D warnings
      - name: Build the wasm reactor
        run: |
          cargo rustc --locked --lib --crate-type cdylib \
            --profile wasm-release --target wasm32-wasip1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Smoke-test the wasm reactor
        run: node scripts/wasm-smoke-test.mjs

  php-lint:
    name: PHP Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          ini-values: zend.assertions=1
      - run: find examples/php -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php -d zend.assertions=1 examples/php/scaffolding/assertions.php
      - run: php -l examples/laravel/app/Demo.php
      - run: find examples/symfony/src examples/symfony/config -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: find examples/yii/src examples/yii/config examples/yii/resources -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: find examples/wordpress/wp-content -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: find examples/drupal/web/modules/custom examples/drupal/web/themes/custom -type f \( -name '*.php' -o -name '*.module' -o -name '*.theme' \) -print0 | xargs -0 -n1 php -l
      - run: find examples/tempest/app examples/tempest/resources examples/tempest/ui -name '*.php' -print0 | xargs -0 -n1 php -l

  benchmark-head:
    name: Benchmark (build head)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      CARGO_BUILD_TARGET: x86_64-unknown-linux-musl
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_RUSTFLAGS: -C link-arg=-fuse-ld=mold
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      BENCHMARK_SHARDS: ${{ inputs.benchmark-shards || '12' }}
    outputs:
      shards: ${{ steps.shards.outputs.matrix }}
      cache-hit: ${{ steps.build.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: ./.github/actions/build-benchmarks
        id: build
        with:
          revision: ${{ github.sha }}
          shards: ${{ env.BENCHMARK_SHARDS }}
      - name: Set measurement workers
        id: shards
        run: |
          python3 - <<'PYTHON' >> "$GITHUB_OUTPUT"
          import json
          import os
          print("matrix=" + json.dumps(list(range(1, int(os.environ["BENCHMARK_SHARDS"]) + 1))))
          PYTHON
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-head
          path: |
            benchmark-build/binaries.tar
            benchmark-build/manifest.json
          if-no-files-found: error
          compression-level: 1
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: release-binary
          path: benchmark-build/release-binary.tar
          if-no-files-found: error
          compression-level: 1
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-head-timings
          path: benchmark-build/cargo-timings/
          if-no-files-found: error
          retention-days: 1

  benchmark-base:
    name: Benchmark (build base)
    runs-on: ubuntu-24.04
    if: github.event_name != 'push'
    permissions:
      contents: read
    env:
      CARGO_BUILD_TARGET: x86_64-unknown-linux-musl
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_RUSTFLAGS: -C link-arg=-fuse-ld=mold
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    outputs:
      revision: ${{ steps.base.outputs.revision }}
      cache-hit: ${{ steps.build.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Identify the actual test-merge parent
        id: base
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            git rev-parse --verify --quiet HEAD^2 > /dev/null
          fi
          echo "revision=$(git rev-parse HEAD^1)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/build-benchmarks
        id: build
        with:
          revision: ${{ steps.base.outputs.revision }}
          baseline: "true"
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-base
          path: |
            benchmark-build/binaries.tar
            benchmark-build/manifest.json
          if-no-files-found: error
          compression-level: 1
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-base-timings
          path: benchmark-build/cargo-timings/
          if-no-files-found: error
          retention-days: 1

  benchmark-shard:
    name: Benchmark (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-24.04
    needs: [benchmark-head, benchmark-base]
    if: ${{ !cancelled() && needs.benchmark-head.result == 'success' && (needs.benchmark-base.result == 'success' || needs.benchmark-base.result == 'skipped') }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        shard: ${{ fromJSON(needs.benchmark-head.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: benchmark-head
          path: benchmark-build
      - uses: actions/download-artifact@v4
        if: github.event_name != 'push'
        with:
          name: benchmark-base
          path: baseline-build
      # Pairing is local and deterministic; it does not need a queued job.
      - name: Prepare the base and head pair
        if: github.event_name != 'push'
        env:
          BASE_REVISION: ${{ needs.benchmark-base.outputs.revision }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/benchmark-base" "$BASE_REVISION"
          python3 benches/ci_benchmarks.py pair --build-dir benchmark-build --baseline-dir baseline-build
          mkdir -p benchmark-build/baseline-bin
          tar -xf baseline-build/binaries.tar --strip-components=1 -C benchmark-build/baseline-bin
      - name: Record benchmark runner
        run: lscpu
      - name: Run benchmark shard
        env:
          BASE_REVISION: ${{ needs.benchmark-base.outputs.revision }}
          SHARD: ${{ matrix.shard }}
        shell: bash
        run: |
          tar -xf benchmark-build/binaries.tar -C benchmark-build
          baseline_args=()
          if [ -n "$BASE_REVISION" ]; then
            baseline_args=(--baseline-source "$RUNNER_TEMP/benchmark-base")
          fi
          python3 benches/ci_benchmarks.py run \
            --build-dir benchmark-build --shard "$SHARD" \
            "${baseline_args[@]}" --output "shard-$SHARD.json"
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ matrix.shard }}
          path: shard-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 1

  benchmark:
    name: Benchmark
    runs-on: ubuntu-24.04
    needs: [benchmark-head, benchmark-base, benchmark-shard]
    permissions:
      contents: write
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.benchmark-shard.result == 'success' }}
    # Only publishing needs this lock; measurements run concurrently.
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: benchmark-head
          path: benchmark-build
      - uses: actions/download-artifact@v4
        with:
          pattern: benchmark-results-*
          path: benchmark-results
          merge-multiple: true
      - name: Check and combine benchmark results
        run: >-
          python3 benches/ci_benchmarks.py merge --build-dir benchmark-build
          --reports-dir benchmark-results --output output.json
      - name: Ensure gh-pages branch exists
        run: |
          if ! git ls-remote --exit-code --heads origin gh-pages > /dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            empty_tree="$(git hash-object -t tree /dev/null)"
            commit="$(git commit-tree "$empty_tree" -m 'Initial gh-pages branch')"
            git push origin "$commit:refs/heads/gh-pages"
          fi
      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: PHPantom Benchmarks
          tool: customSmallerIsBetter
          output-file-path: output.json
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          auto-push: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # Preserve the required check and compare only a complete set of results.
  benchmark-pr:
    name: Benchmark (PR comparison)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    needs: [benchmark-head, benchmark-base, benchmark-shard]
    if: ${{ !cancelled() && github.event_name != 'push' }}
    steps:
      - name: Check benchmark jobs passed
        env:
          BUILD_RESULT: ${{ needs.benchmark-head.result }}
          BASE_RESULT: ${{ needs.benchmark-base.result }}
          SHARD_RESULT: ${{ needs.benchmark-shard.result }}
        run: |
          test "$BUILD_RESULT" = success
          test "$BASE_RESULT" = success
          test "$SHARD_RESULT" = success
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: benchmark-head
          path: benchmark-build
      - uses: actions/download-artifact@v4
        with:
          pattern: benchmark-results-*
          path: benchmark-results
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: benchmark-base
          path: baseline-build
      - name: Pair benchmark manifests
        run: python3 benches/ci_benchmarks.py pair --build-dir benchmark-build --baseline-dir baseline-build
      - name: Check and combine benchmark results
        run: >-
          python3 benches/ci_benchmarks.py merge --build-dir benchmark-build
          --reports-dir benchmark-results --output output.json
      - name: Compare paired measurements
        env:
          BASE_REVISION: ${{ needs.benchmark-base.outputs.revision }}
          HEAD_REVISION: ${{ github.sha }}
        run: |
          python3 benches/ci_benchmarks.py compare --build-dir benchmark-build \
            --results output.json --summary "$GITHUB_STEP_SUMMARY" \
            --base-revision "$BASE_REVISION" --head-revision "$HEAD_REVISION" \
            --threshold 1.30
      - name: Report workflow timing and cache outcomes
        if: ${{ !cancelled() }}
        uses: actions/github-script@v7
        env:
          HEAD_CACHE_HIT: ${{ needs.benchmark-head.outputs.cache-hit }}
          BASE_CACHE_HIT: ${{ needs.benchmark-base.outputs.cache-hit }}
        with:
          script: |
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              ...context.repo, run_id: context.runId, per_page: 100
            });
            const seconds = (start, end) => Math.max(0, Math.round((Date.parse(end) - Date.parse(start)) / 1000));
            const rows = [["Job", "Queue (s)", "Execution (s)", "Result"]];
            for (const job of jobs) {
              if (!job.started_at || job.started_at.startsWith("0001")) continue;
              rows.push([
                job.name,
                String(seconds(job.created_at, job.started_at)),
                job.completed_at ? String(seconds(job.started_at, job.completed_at)) : "Running",
                job.conclusion || job.status
              ]);
            }
            await core.summary
              .addHeading("Workflow timings", 2)
              .addRaw(`Exact release artifact cache: head=${process.env.HEAD_CACHE_HIT || "false"}, base=${process.env.BASE_CACHE_HIT || "false"}\n\n`)
              .addTable(rows)
              .write();

  scaling:
    name: Scaling
    runs-on: ubuntu-24.04
    needs: benchmark-head
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-binary
      - run: tar -xf release-binary.tar
      # Compare each pathological input at N and 2N on the shared release build.
      - name: Check how analysis cost grows with input size
        run: python3 benches/scaling.py --binary "$PWD/phpantom_lsp"

  memory-benchmark:
    name: Memory Benchmark
    runs-on: ubuntu-24.04
    needs: benchmark-head
    permissions:
      contents: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Shares the gh-pages lock with the Benchmark job.
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-binary
      - run: tar -xf release-binary.tar
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          tools: composer
      - name: Find Composer download cache
        id: composer-cache
        run: echo "path=$(composer config --global cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: composer
        with:
          path: ${{ steps.composer-cache.outputs.path }}
          key: composer-${{ runner.os }}-${{ hashFiles('benches/fixtures/**/composer.lock', 'examples/tempest/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - name: Measure memory usage
        shell: bash
        run: |
          # THP mode affects resident memory (2 MiB backing pages in
          # `always` mode); log it so the numbers are interpretable.
          cat /sys/kernel/mm/transparent_hugepage/enabled || true
          python3 benches/memory_usage.py --binary "$PWD/phpantom_lsp" | tee memory_output.json
      - uses: actions/cache/save@v4
        if: steps.composer.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.composer-cache.outputs.path }}
          key: ${{ steps.composer.outputs.cache-primary-key }}
      - name: Ensure gh-pages branch exists
        run: |
          if ! git ls-remote --exit-code --heads origin gh-pages > /dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            empty_tree="$(git hash-object -t tree /dev/null)"
            commit="$(git commit-tree "$empty_tree" -m 'Initial gh-pages branch')"
            git push origin "$commit:refs/heads/gh-pages"
          fi
      - name: Store memory benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: PHPantom Memory Usage
          tool: customSmallerIsBetter
          output-file-path: memory_output.json
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/memory
          auto-push: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

  memory-benchmark-pr:
    name: Memory Benchmark (PR comparison)
    runs-on: ubuntu-24.04
    needs: benchmark-head
    permissions:
      contents: read
      pull-requests: write
    if: github.event_name != 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-binary
      - run: tar -xf release-binary.tar
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          tools: composer
      - name: Find Composer download cache
        id: composer-cache
        run: echo "path=$(composer config --global cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: composer
        with:
          path: ${{ steps.composer-cache.outputs.path }}
          key: composer-${{ runner.os }}-${{ hashFiles('benches/fixtures/**/composer.lock', 'examples/tempest/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - name: Check gh-pages branch exists
        id: check-gh-pages
        run: |
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ gh-pages branch does not exist yet — skipping memory benchmark comparison"
          fi
      - name: Measure memory usage
        if: steps.check-gh-pages.outputs.exists == 'true'
        shell: bash
        run: |
          cat /sys/kernel/mm/transparent_hugepage/enabled || true
          python3 benches/memory_usage.py --binary "$PWD/phpantom_lsp" | tee memory_output.json
      - uses: actions/cache/save@v4
        if: steps.check-gh-pages.outputs.exists == 'true' && steps.composer.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.composer-cache.outputs.path }}
          key: ${{ steps.composer.outputs.cache-primary-key }}
      - name: Compare against baseline
        if: steps.check-gh-pages.outputs.exists == 'true'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: PHPantom Memory Usage
          tool: customSmallerIsBetter
          output-file-path: memory_output.json
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/memory
          auto-push: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Fork and Dependabot runs report alerts in the job summary.
          comment-on-alert: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
          summary-always: true
          alert-threshold: "130%"
          fail-on-alert: true
          alert-comment-cc-users: "@AJenbo"
