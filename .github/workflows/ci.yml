name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # The Linux binaries we ship are static musl builds (see
  # release.yml). CI builds, tests, and benchmarks the same target so
  # it exercises exactly what users run, including the mimalloc
  # allocator that is only compiled in for musl.
  CARGO_BUILD_TARGET: x86_64-unknown-linux-musl
  # Full debuginfo makes every debug test binary 500-900 MB, and the
  # coverage and lint jobs build a dozen of them, which fills the
  # runner's disk. Line tables keep file:line in panic backtraces,
  # and coverage does not read debuginfo at all.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test benchmark sharding
        run: python3 -m unittest discover -s benches -p 'test_ci_benchmarks.py'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ env.CARGO_BUILD_TARGET }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build
      - name: Set up musl build
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools mold
          mkdir -p .cargo
          printf '[target.%s]\nrustflags = ["-C", "link-arg=-fuse-ld=mold"]\n' "$CARGO_BUILD_TARGET" >> .cargo/config.toml
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # `semantic-export` is off by default, so nothing above compiles it.
      # Without these steps a refactor of an internal API breaks the module
      # and no job notices until someone builds with the feature on. They
      # run here rather than in the test job so that job keeps measuring
      # exactly the feature set the released binary is built with.
      - run: cargo clippy --all-targets --features semantic-export -- -D warnings
      # Only the lib and the integration binary hold these tests; building
      # every other test target as well would only cost disk.
      - run: cargo test --features semantic-export --lib --test integration semantic_export

  # Path handling differs on Windows (drive letters, `\` separators,
  # `\\?\` canonical paths), and nothing else in CI runs there. It does not
  # block until the suite passes there.
  test-windows:
    name: Test (Windows)
    runs-on: windows-latest
    continue-on-error: true
    env:
      CARGO_BUILD_TARGET: x86_64-pc-windows-msvc
    steps:
      # The runner checks out with CRLF line endings, which would shift
      # every offset the fixtures and embedded stubs are tested at.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - run: cargo nextest run --no-fail-fast

  test-shard:
    name: Test (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      # Every shard builds the full instrumented test suite, the largest
      # build in this workflow. Drop preinstalled toolchains we never use
      # to give it headroom.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.CARGO_BUILD_TARGET }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: coverage
          # All shards build the same binaries and share one dependency cache.
          save-if: ${{ matrix.shard == 1 }}
      - name: Set up musl build
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools mold
          mkdir -p .cargo
          printf '[target.%s]\nrustflags = ["-C", "link-arg=-fuse-ld=mold"]\n' "$CARGO_BUILD_TARGET" >> .cargo/config.toml
      - name: Install cargo-llvm-cov and cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - name: Run tests with coverage
        env:
          # nextest runs each test in its own process, and the default
          # `%p` (per-pid) profile name leaves one full-size .profraw per
          # test, thousands per shard. `%m` without `%p` merges every
          # process of the same binary into a small pool of files instead.
          LLVM_PROFILE_FILE_NAME: phpantom-%8m.profraw
        run: >-
          cargo llvm-cov nextest
          --partition hash:${{ matrix.shard }}/${{ strategy.job-total }}
          --lcov --output-path lcov-${{ matrix.shard }}.info
      - name: Save coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.shard }}
          path: lcov-${{ matrix.shard }}.info
          if-no-files-found: error
          retention-days: 1

  # Preserve the required "Test" check and upload only complete coverage.
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: test-shard
    if: always()
    steps:
      - name: Check all test shards passed
        env:
          SHARD_RESULT: ${{ needs.test-shard.result }}
        run: test "$SHARD_RESULT" = success
      - uses: actions/checkout@v4
      - name: Download coverage reports
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage
          merge-multiple: true
      - name: List coverage reports
        id: reports
        run: |
          reports=(coverage/lcov-*.info)
          (IFS=,; echo "files=${reports[*]}") >> "$GITHUB_OUTPUT"
      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ${{ steps.reports.outputs.files }}
          disable_search: true
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  wasm:
    name: WebAssembly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm
      # `--target` on the command line overrides the musl CARGO_BUILD_TARGET
      # this workflow sets for every other job.
      - run: cargo clippy --lib --target wasm32-wasip1 -- -D warnings
      - name: Build the wasm reactor
        run: |
          cargo rustc --lib --crate-type cdylib \
            --profile wasm-release --target wasm32-wasip1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Smoke-test the wasm reactor
        run: node scripts/wasm-smoke-test.mjs

  php-lint:
    name: PHP Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          ini-values: zend.assertions=1
      - run: find examples/php -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php -d zend.assertions=1 examples/php/scaffolding/assertions.php
      - run: php -l examples/laravel/app/Demo.php
      - run: find examples/symfony/src examples/symfony/config -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: find examples/yii/src examples/yii/config examples/yii/resources -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: find examples/wordpress/wp-content -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: find examples/drupal/web/modules/custom examples/drupal/web/themes/custom -type f \( -name '*.php' -o -name '*.module' -o -name '*.theme' \) -print0 | xargs -0 -n1 php -l
      - run: find examples/tempest/app -name '*.php' -print0 | xargs -0 -n1 php -l

  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Both jobs push their results to gh-pages. Two pushes to main in
    # quick succession would otherwise race, and the later push is
    # rejected as a non-fast-forward.
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.CARGO_BUILD_TARGET }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build
      - name: Set up musl build
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools mold
          mkdir -p .cargo
          printf '[target.%s]\nrustflags = ["-C", "link-arg=-fuse-ld=mold"]\n' "$CARGO_BUILD_TARGET" >> .cargo/config.toml
      - name: Ensure gh-pages branch exists
        run: |
          if ! git ls-remote --exit-code --heads origin gh-pages > /dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            empty_tree="$(git hash-object -t tree /dev/null)"
            commit="$(git commit-tree "$empty_tree" -m 'Initial gh-pages branch')"
            git push origin "$commit:refs/heads/gh-pages"
          fi
      - name: Run benchmarks
        shell: bash
        run: |
          # History lives on gh-pages, so Criterion's own baseline is
          # unused -- and the restored target cache leaves a partial one
          # behind that it then errors on for every benchmark.
          rm -rf target/criterion
          cargo bench --bench completion --bench references \
            --bench laravel_completion --bench custom_builder \
            --bench symfony_completion --bench yii_completion \
            --bench wordpress_completion --bench drupal_completion \
            -- --output-format bencher | tee raw_output.txt
      - name: Convert to milliseconds
        shell: bash
        run: |
          python3 benches/format_bench_output.py < raw_output.txt > output.json || {
            echo "::group::raw_output.txt"
            cat raw_output.txt
            echo "::endgroup::"
            exit 1
          }
      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: PHPantom Benchmarks
          tool: customSmallerIsBetter
          output-file-path: output.json
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          auto-push: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

  benchmark-build-pr:
    name: Benchmark (build)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_RUSTFLAGS: -C link-arg=-fuse-ld=mold
    outputs:
      base-revision: ${{ steps.base.outputs.revision }}
      shards: ${{ steps.prepare.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      # The checkout is GitHub's test merge of the PR into its base, so its
      # first parent is exactly the base the measured head was built on.
      # `pull_request.base.sha` is not guaranteed to be that parent.
      - name: Find base revision
        id: base
        run: |
          git rev-parse --verify --quiet HEAD^2 > /dev/null
          echo "revision=$(git rev-parse HEAD^1)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.CARGO_BUILD_TARGET }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build
      - name: Set up musl build
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools mold
      - name: Build both revisions and partition benchmarks
        id: prepare
        env:
          SHARD_COUNT: 4
          BASE_REVISION: ${{ steps.base.outputs.revision }}
        shell: bash
        run: |
          benchmark_root="$PWD"
          base_source="$RUNNER_TEMP/benchmark-base"
          git worktree add --detach "$base_source" "$BASE_REVISION"
          cargo bench --locked --manifest-path "$base_source/Cargo.toml" \
            --bench '*' --no-run --message-format=json > baseline-build.jsonl
          (
            cd "$base_source"
            python3 "$benchmark_root/benches/ci_benchmarks.py" prepare \
              --build-dir "$benchmark_root/baseline-build" --shards 1 \
              < "$benchmark_root/baseline-build.jsonl"
          )
          cargo bench --locked --bench '*' --no-run --message-format=json \
            > benchmark-build.jsonl
          python3 benches/ci_benchmarks.py prepare \
            --build-dir benchmark-build --shards "$SHARD_COUNT" \
            --baseline-dir baseline-build < benchmark-build.jsonl
          python3 -c 'import json, os; print("shards=" + json.dumps(list(range(1, int(os.environ["SHARD_COUNT"]) + 1))))' >> "$GITHUB_OUTPUT"
      - name: Save benchmark executables
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-executables
          path: benchmark-build/binaries.tar
          if-no-files-found: error
          retention-days: 1
      - name: Save benchmark manifest
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-manifest
          path: benchmark-build/manifest.json
          if-no-files-found: error
          retention-days: 1

  benchmark-shard-pr:
    name: Benchmark (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    needs: benchmark-build-pr
    if: github.event_name == 'pull_request' && needs.benchmark-build-pr.result == 'success'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.benchmark-build-pr.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Check out baseline fixtures
        env:
          BASE_REVISION: ${{ needs.benchmark-build-pr.outputs.base-revision }}
        run: git worktree add --detach "$RUNNER_TEMP/benchmark-base" "$BASE_REVISION"
      - uses: actions/download-artifact@v4
        with:
          name: benchmark-executables
          path: benchmark-build
      - uses: actions/download-artifact@v4
        with:
          name: benchmark-manifest
          path: benchmark-build
      - name: Record benchmark runner
        run: lscpu
      # Both static musl revisions run on this machine with their own fixtures.
      # Tar preserves executable permissions; no toolchain is needed here.
      - name: Run paired benchmark shard
        run: |
          tar -xf benchmark-build/binaries.tar -C benchmark-build
          python3 benches/ci_benchmarks.py run \
            --build-dir benchmark-build --shard "${{ matrix.shard }}" \
            --baseline-source "$RUNNER_TEMP/benchmark-base" \
            --output "shard-${{ matrix.shard }}.json"
      - name: Save benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ matrix.shard }}
          path: shard-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 1

  # Preserve the required check and compare only a complete set of results.
  benchmark-pr:
    name: Benchmark (PR comparison)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [benchmark-build-pr, benchmark-shard-pr]
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    steps:
      - name: Check benchmark jobs passed
        env:
          BUILD_RESULT: ${{ needs.benchmark-build-pr.result }}
          SHARD_RESULT: ${{ needs.benchmark-shard-pr.result }}
        run: |
          test "$BUILD_RESULT" = success
          test "$SHARD_RESULT" = success
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: benchmark-manifest
          path: benchmark-build
      - uses: actions/download-artifact@v4
        with:
          pattern: benchmark-results-*
          path: benchmark-results
          merge-multiple: true
      - name: Check and combine benchmark results
        run: >-
          python3 benches/ci_benchmarks.py merge --build-dir benchmark-build
          --reports-dir benchmark-results --output output.json
      - name: Compare paired measurements
        env:
          BASE_REVISION: ${{ needs.benchmark-build-pr.outputs.base-revision }}
          HEAD_REVISION: ${{ github.sha }}
        run: |
          python3 benches/ci_benchmarks.py compare --build-dir benchmark-build \
            --results output.json --summary "$GITHUB_STEP_SUMMARY" \
            --base-revision "$BASE_REVISION" --head-revision "$HEAD_REVISION" \
            --threshold 1.30

  scaling:
    name: Scaling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.CARGO_BUILD_TARGET }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build
      - name: Set up musl build
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools mold
          mkdir -p .cargo
          printf '[target.%s]\nrustflags = ["-C", "link-arg=-fuse-ld=mold"]\n' "$CARGO_BUILD_TARGET" >> .cargo/config.toml
      - name: Build release binary
        run: cargo build --release
      # Compares the time of each pathological input shape at N and 2N,
      # so it needs no history and holds on any runner.
      - name: Check how analysis cost grows with input size
        run: python3 benches/scaling.py --binary "target/$CARGO_BUILD_TARGET/release/phpantom_lsp"

  memory-benchmark:
    name: Memory Benchmark
    runs-on: ubuntu-latest
    needs: benchmark
    permissions:
      contents: write
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Shares the gh-pages lock with the Benchmark job.
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.CARGO_BUILD_TARGET }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          tools: composer
      - name: Set up musl build
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools mold
          mkdir -p .cargo
          printf '[target.%s]\nrustflags = ["-C", "link-arg=-fuse-ld=mold"]\n' "$CARGO_BUILD_TARGET" >> .cargo/config.toml
      - name: Build release binary
        run: cargo build --release
      - name: Measure memory usage
        shell: bash
        run: |
          # THP mode affects resident memory (2 MiB backing pages in
          # `always` mode); log it so the numbers are interpretable.
          cat /sys/kernel/mm/transparent_hugepage/enabled || true
          python3 benches/memory_usage.py --binary "target/$CARGO_BUILD_TARGET/release/phpantom_lsp" | tee memory_output.json
      - name: Store memory benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: PHPantom Memory Usage
          tool: customSmallerIsBetter
          output-file-path: memory_output.json
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/memory
          auto-push: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

  memory-benchmark-pr:
    name: Memory Benchmark (PR comparison)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.CARGO_BUILD_TARGET }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          tools: composer
      - name: Set up musl build
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools mold
          mkdir -p .cargo
          printf '[target.%s]\nrustflags = ["-C", "link-arg=-fuse-ld=mold"]\n' "$CARGO_BUILD_TARGET" >> .cargo/config.toml
      - name: Build release binary
        run: cargo build --release
      - name: Check gh-pages branch exists
        id: check-gh-pages
        run: |
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ gh-pages branch does not exist yet — skipping memory benchmark comparison"
          fi
      - name: Measure memory usage
        if: steps.check-gh-pages.outputs.exists == 'true'
        shell: bash
        run: |
          cat /sys/kernel/mm/transparent_hugepage/enabled || true
          python3 benches/memory_usage.py --binary "target/$CARGO_BUILD_TARGET/release/phpantom_lsp" | tee memory_output.json
      - name: Compare against baseline
        if: steps.check-gh-pages.outputs.exists == 'true'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: PHPantom Memory Usage
          tool: customSmallerIsBetter
          output-file-path: memory_output.json
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/memory
          auto-push: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Fork and Dependabot runs report alerts in the job summary.
          comment-on-alert: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
          summary-always: true
          alert-threshold: "130%"
          fail-on-alert: true
          alert-comment-cc-users: "@AJenbo"
