acme.greeting:
  path: '/acme/greeting/{name}'
  defaults:
    # Try: go to the definition of GreetingController, or of greet after the
    # `::`. A class name or a `Class::method` string in YAML navigates in any
    # project, and counts among the references of what it names.
    _controller: '\Drupal\acme\Controller\GreetingController::greet'
    _title: 'Greeting'
  requirements:
    _permission: 'access content'
