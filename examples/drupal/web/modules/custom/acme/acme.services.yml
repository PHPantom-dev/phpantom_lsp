parameters:
  acme.greeting_format: 'Hello @name, welcome to @site.'

services:
  acme.greeter:
    # Try: go to the definition of Greeter, or find its references: this
    # line is one of them.
    class: Drupal\acme\Greeter
    # Try: go to the definition of `@config.factory`, which core declares,
    # or of `%acme.greeting_format%`. Complete a service ID after `@`.
    arguments: ['@config.factory', '%acme.greeting_format%']
    # Try: go to the definition of setStringTranslation, which Greeter takes
    # from core's StringTranslationTrait, or complete a method name inside
    # the brackets.
    calls:
      - [setStringTranslation, ['@string_translation']]
  acme.request_clock:
    class: Drupal\acme\RequestClock
    # Try: go to the definition of datetime.time, which core declares. The
    # container hands out RequestClock for it, so a lookup of datetime.time
    # is typed as either class (see acme_request_age() in acme.module).
    decorates: datetime.time
    arguments: ['@.inner']
  # Lets controllers and hook classes autowire the greeter by its class.
  Drupal\acme\Greeter: '@acme.greeter'
  # Try: open src/EventSubscriber/GreetingSubscriber.php, which builds its
  # map by assignment, or src/EventSubscriber/RequestSubscriber.php, which
  # returns it. Each listener method its map names navigates.
  acme.greeting_subscriber:
    class: Drupal\acme\EventSubscriber\GreetingSubscriber
    tags:
      - { name: event_subscriber }
  acme.request_subscriber:
    class: Drupal\acme\EventSubscriber\RequestSubscriber
    tags:
      - { name: event_subscriber }
