# Try: go to the definition of 'acme.settings' in SettingsForm, which lists
# config/install/acme.settings.yml and then this entry.
acme.settings:
  type: config_object
  label: 'Acme settings'
  mapping:
    notify_email:
      type: email
      label: 'Notification email'
    notifications:
      type: mapping
      label: 'Notifications'
      mapping:
        email:
          type: boolean
          label: 'Send notifications by email'
