parameters:
  app.support_email: support@example.com

services:
  App\:
    resource: '../src/'
  App\Service\WelcomeMailer:
    # Try: go to the definition of setSender, which the container calls
    # after building the mailer, or complete a method name inside the
    # brackets.
    calls:
      - [setSender, ['%app.sender_name%']]
  App\EventListener\OrderPlacedListener:
    tags:
      - { name: kernel.event_listener, event: app.order.placed, method: onOrderPlaced }
  # Try: go-to-definition on app.welcome_mailer below. It is declared in
  # config/services.php, and find references on it lists every file that
  # names it.
  app.legacy_mailer: '@app.welcome_mailer'
