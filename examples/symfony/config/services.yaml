parameters:
  app.support_email: support@example.com

services:
  _defaults:
    bind:
      # Try: jump to the QueryBus constructor parameter.
      $queryBus: '@query.bus'
  App\:
    resource: '../src/'
  App\Service\WelcomeMailer:
    # Try: go to the definition of setSender, which the container calls
    # after building the mailer, or complete a method name inside the
    # brackets.
    calls:
      - [setSender, ['%app.sender_name%']]
  App\EventListener\OrderPlacedListener:
    # Try: jump from onOrderPlaced to the listener method.
    tags:
      - { name: kernel.event_listener, event: app.order.placed, method: onOrderPlaced }
  app.slugger:
    class: App\Service\Slugger
  App\Service\CachingSlugger:
    # Try: go-to-definition on app.slugger. The container hands out
    # CachingSlugger for it, so a lookup of app.slugger is typed as either
    # class (see DemoController).
    decorates: app.slugger
    arguments:
      # Try: jump to the parameter of CachingSlugger's constructor.
      $inner: '@.inner'
  app.config_tree:
    class: Symfony\Component\Config\Definition\Builder\TreeBuilder
    # Try: jump to getConfigTreeBuilder on the configuration service.
    factory: ['@App\DependencyInjection\Configuration', 'getConfigTreeBuilder']
  # Try: go-to-definition on app.welcome_mailer below. It is declared in
  # config/services.php, and find references on it lists every file that
  # names it.
  app.legacy_mailer: '@app.welcome_mailer'
